[project]
name = "sim"
version = "0.1.0"
description = "Simulador de transmissao digital: codificacao de linha, modulacao, canal AWGN/rajadas e BER"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "python-pptx>=1.0.2",
]
